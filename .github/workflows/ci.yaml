name: Build

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from the root package.json "packageManager" field
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: "pnpm"

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run check

      - name: Build
        run: pnpm build

      # typecheck must occur after build because the packages
      # depend on the build output of each other
      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      - name: Bundle budget
        run: |
          pnpm run test:bundle
          pnpm run check:bundle
